name: CI TaskAnalyzer

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Executar Test Harness
        run: python -m pytest -v

  imagem-docker:
    name: Construir imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
      - name: Construir imagem
        run: docker build --pull --tag sdd-task-analyzer:ci .
